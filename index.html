<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Fixonest connects you with verified, background-checked professionals for repair and household services — book in minutes, on your schedule."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fixonest — Repair & household services, booked in minutes" />
    <meta
      property="og:description"
      content="Verified, background-checked professionals for every repair and household service you need — on your schedule."
    />
    <title>Fixonest</title>
    <script>
      // Runs before React mounts so the correct theme applies on first
      // paint (no flash of the wrong theme). Mirrors the "theme" key/logic
      // in src/lib/config.js + features/theme — keep both in sync by hand.
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#0a0a13" : "#4f46e5");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
